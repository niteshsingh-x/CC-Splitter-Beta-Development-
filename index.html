<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crawler Coupon Distributor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="brand-header">
        <span class="company-name">Sellergize</span>
        <span class="tool-title">Crawler Coupon Distributor</span>
    </div>
    
    <div class="input-group">
        <label for="numberInput">InputS Such as(sum of coupons, Persons & Starting ID. {Every Format is Acceptable} ):</label>
        <input type="text" id="numberInput" placeholder="Type here..." autocomplete="off" autofocus>
    </div>

    <div id="errorMessage" class="error"></div>
    
    <div id="actionBar" class="action-bar">
        <button id="copyAllBtn" class="copy-all-btn">Copy All</button>
    </div>
    
    <div id="output" class="output-group"></div>
</div>

<script src="script.js"></script>
</body>
</html>
